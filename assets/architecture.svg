<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<rect width="1200" height="430" rx="20" fill="#f8fafc"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">System Architecture</text>
<text x="40" y="75" font-family="Arial,sans-serif" font-size="15" fill="#475569">Input → face detection → preprocessing → two deep-learning branches → final predictions</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="35" y="125" width="160" height="85" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="115" y="157" font-size="17" font-weight="700" fill="#075985">Input</text><text x="115" y="181" font-size="14" fill="#334155">Image / Webcam</text>
<rect x="225" y="125" width="175" height="85" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="312" y="157" font-size="17" font-weight="700" fill="#075985">Face Detection</text><text x="312" y="181" font-size="14" fill="#334155">OpenCV Haar Cascade</text>
<rect x="430" y="125" width="175" height="85" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="517" y="157" font-size="17" font-weight="700" fill="#075985">Face Crop</text><text x="517" y="181" font-size="14" fill="#334155">Resize + Normalize</text>
<line x1="195" y1="167" x2="225" y2="167" stroke="#64748b" stroke-width="3"/><polygon points="225,167 215,161 215,173" fill="#64748b"/>
<line x1="400" y1="167" x2="430" y2="167" stroke="#64748b" stroke-width="3"/><polygon points="430,167 420,161 420,173" fill="#64748b"/>
<rect x="650" y="95" width="220" height="90" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="760" y="128" font-size="17" font-weight="700" fill="#b91c1c">Emotion Model</text><text x="760" y="151" font-size="14" fill="#475569">Custom CNN · FER2013</text><text x="760" y="172" font-size="13" fill="#475569">7 emotion classes</text>
<rect x="650" y="215" width="220" height="90" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="760" y="248" font-size="17" font-weight="700" fill="#1d4ed8">Age + Gender Model</text><text x="760" y="271" font-size="14" fill="#475569">MobileNetV2 · UTKFace</text><text x="760" y="292" font-size="13" fill="#475569">7 age groups + 2 genders</text>
<line x1="605" y1="167" x2="650" y2="140" stroke="#64748b" stroke-width="3"/><polygon points="650,140 638,138 644,148" fill="#64748b"/>
<line x1="605" y1="167" x2="650" y2="260" stroke="#64748b" stroke-width="3"/><polygon points="650,260 644,252 638,262" fill="#64748b"/>
<rect x="915" y="95" width="125" height="90" rx="14" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/><text x="977" y="128" font-size="16" font-weight="700" fill="#7e22ce">Emotion</text><text x="977" y="153" font-size="14" fill="#475569">7 classes</text>
<rect x="915" y="215" width="125" height="90" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="977" y="248" font-size="16" font-weight="700" fill="#15803d">Age + Gender</text><text x="977" y="273" font-size="14" fill="#475569">7 + 2 classes</text>
<line x1="870" y1="140" x2="915" y2="140" stroke="#64748b" stroke-width="3"/><polygon points="915,140 905,134 905,146" fill="#64748b"/>
<line x1="870" y1="260" x2="915" y2="260" stroke="#64748b" stroke-width="3"/><polygon points="915,260 905,254 905,266" fill="#64748b"/>
<rect x="1065" y="135" width="110" height="135" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1120" y="168" font-size="16" font-weight="700" fill="#047857">Final</text><text x="1120" y="191" font-size="16" font-weight="700" fill="#047857">Predictions</text><text x="1120" y="220" font-size="13" fill="#475569">Emotion</text><text x="1120" y="241" font-size="13" fill="#475569">Age group</text><text x="1120" y="262" font-size="13" fill="#475569">Gender</text>
<line x1="1040" y1="140" x2="1065" y2="190" stroke="#64748b" stroke-width="3"/><polygon points="1065,190 1055,184 1060,177" fill="#64748b"/>
