<rect x="35" y="350" width="1140" height="45" rx="12" fill="#0f172a"/><text x="605" y="379" font-size="15" fill="#e2e8f0">Local Webcam App (OpenCV)  •  Streamlit Web App  •  Same trained models</text>
</g></svg>